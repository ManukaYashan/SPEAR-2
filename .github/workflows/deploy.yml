name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # runs on every push to main
  workflow_dispatch:  # also allows manual trigger from GitHub UI

# Sets permissions so the action can write to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build (outputs to ./out because output:'export' is set)
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Add .nojekyll so GitHub Pages serves _next/ assets correctly
      #    (Jekyll ignores folders starting with underscore by default)
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # 6. Deploy the out/ folder to the gh-pages branch
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true   # keeps gh-pages branch clean (no history)
